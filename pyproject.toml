[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drone-delivery-platform"
version = "0.1.0"
description = "Agentic multi-agent reinforcement learning platform for autonomous drone delivery"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13",
  "fastapi>=0.115",
  "gymnasium>=1.0",
  "httpx>=0.27",
  "langgraph>=0.2",
  "mlflow>=2.17",
  "numpy>=2.0",
  "opentelemetry-api>=1.27",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "pandas>=2.2",
  "pettingzoo>=1.24",
  "prometheus-client>=0.21",
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "python-jose[cryptography]>=3.3",
  "python-multipart>=0.0.12",
  "pyyaml>=6.0",
  "redis>=5.1",
  "scikit-learn>=1.5",
  "sqlalchemy>=2.0",
  "torch>=2.4",
  "uvicorn[standard]>=0.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[tool.hatch.build.targets.wheel]
packages = ["apps", "packages"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

